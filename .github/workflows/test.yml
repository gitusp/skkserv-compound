name: test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - run: sudo xcode-select -s '/Applications/Xcode_16.4.app/Contents/Developer'
    - name: Run tests
      run: swift test 2>&1 | xcbeautify
