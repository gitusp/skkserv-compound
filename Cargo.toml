[package]
name = "skkserv-compound"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A skkserv that returns compound candidates built from SKK dictionaries."

[[bin]]
name = "skkserv-compound"
path = "src/main.rs"

[lib]
name = "skkserv_compound"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal"] }
encoding_rs = "0.8"
notify = "8"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
